name: Package Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: package-candidate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  pack:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Resolve merged pull request
        id: merge
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('pr-number', String(context.payload.pull_request.number));
              return;
            }
            const { owner, repo } = context.repo;
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: process.env.HEAD_SHA,
            });
            const merged = pullRequests.find(
              (pullRequest) => pullRequest.merged_at && pullRequest.base.ref === context.payload.repository.default_branch &&
                pullRequest.merge_commit_sha === process.env.HEAD_SHA,
            );
            core.setOutput('pr-number', merged ? String(merged.number) : '');

      - name: Set immutable candidate version
        id: candidate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ steps.merge.outputs.pr-number }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-manifests/packages/timezone" "$RUNNER_TEMP/npm-manifests/packages/mysql"
          cp package.json "$RUNNER_TEMP/npm-manifests/package.json"
          cp packages/timezone/package.json "$RUNNER_TEMP/npm-manifests/packages/timezone/package.json"
          cp packages/mysql/package.json "$RUNNER_TEMP/npm-manifests/packages/mysql/package.json"
          if [ -n "$PR_NUMBER" ]; then
            SUFFIX="beta.pr${PR_NUMBER}.sha${HEAD_SHA:0:12}"
          else
            SUFFIX="candidate.sha${HEAD_SHA:0:12}"
          fi
          node scripts/version-package-candidate.mjs "$SUFFIX"
          npm install --package-lock-only --ignore-scripts
          echo "artifact=npm-candidate-${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUMBER" ]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        run: npm run build

      - name: Test candidate dependency graph
        run: npm run test:package

      - name: Pack candidate
        run: |
          mkdir -p "$RUNNER_TEMP/npm-candidate"
          npm pack --ignore-scripts --workspaces --include-workspace-root --pack-destination "$RUNNER_TEMP/npm-candidate"

      - name: Validate all candidate archives without publishing
        env:
          CANDIDATE_SUFFIX: ${{ steps.candidate.outputs.suffix }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: >-
          node scripts/publish-packages.mjs --directory "$RUNNER_TEMP/npm-candidate"
          --manifests "$RUNNER_TEMP/npm-manifests" --tag "$CANDIDATE_TAG" --suffix "$CANDIDATE_SUFFIX"

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          path: ${{ runner.temp }}/npm-candidate/*.tgz
          if-no-files-found: error
          retention-days: 7
